<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/icon.png" type="image/x-icon">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


   <h1 class="heading">Rock - Paper - Scissors</h1>
    
   <div class="choices">
       <button onclick="playGame('rock')"><img src="images/rock.png" alt="img"/></button>
       <button onclick="playGame('paper')"><img src="images/paper.png" alt="img"/></button>
       <button onclick="playGame('scissors')"><img src="images/scissors.png" alt="img"/></button>
   </div>

 <div class="scoreall">
   <div id="playerDisplay">PLAYER: </div>
   <div id="computerDisplay">COMPUTER: </div>
   <div id="resultDisplay"></div>
 </div>

   <div class="scoreDisplay">Player Score: 
       <span id="playerScoreDisplay">0</span>
   </div>

   <div class="scoreDisplay">Computer Score: 
       <span id="computerScoreDisplay">0</span>
   </div>

        </a>
      </p>
    </footer>



   <script src="script.js"></script>
</body>
</html>
